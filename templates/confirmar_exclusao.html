<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Exclusão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container mt-5">
        <div class="card shadow-sm bg-dark text-light">
            <div class="card-header text-center">
                <h3 class="text-danger">Confirmação de Exclusão</h3>
            </div>
            <div class="card-body">
                <h5 class="card-title">Tem certeza que deseja excluir sua conta?</h5>
                <p class="card-text">Você está prestes a excluir a sua conta <strong>{{ user.username }}</strong>.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
                        <a href="{% url 'index' %}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Script do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
